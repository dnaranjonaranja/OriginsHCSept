<!DOCTYPE html>
<html lang="es" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8D — Azul (accent navy)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@300..700&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Variante NAVY — acento azul oscuro, con pequeño toque de naranja.
       Sobrescribe --amber (que controla italics editoriales, "acción semanal",
       primary button) con un navy saturado distinto al --ink del cuerpo,
       de forma que las cursivas sigan teniendo presencia editorial.
       El naranja sobrevive como Mi Base (pilar) y como puntito del step actual. */
    [data-mode="light"] {
      --amber: #1f3a64;       /* navy accent — un poco más claro que --ink */
      --amber-2: #15294a;
      --amber-soft: rgba(31, 58, 100, 0.10);

      /* Toque de naranja: queda solo para el dot "current" del step trail
         y para el pilar Base (que es naranja por marca). */
      --touch-orange: #e85a3e;
    }

    /* El primary button en light ya está override a fondo navy; lo dejamos.
       Pero para que destaque sobre el resto del UI ahora dominado por navy,
       le añadimos un acento naranja en hover. */
    [data-mode="light"] .btn-primary {
      background: #0f1b2e;
      color: #fbf7ef;
      box-shadow: 0 0 0 0 var(--touch-orange);
      transition: box-shadow 240ms ease, transform 240ms ease, filter 240ms ease;
    }
    [data-mode="light"] .btn-primary:hover {
      filter: none;
      box-shadow: 0 0 0 3px rgba(232, 90, 62, 0.22);
      transform: translateY(-1px);
    }

    /* Step trail: el "current" mantiene su naranja como acento de movimiento */
    [data-mode="light"] .steps-trail .step.current {
      background: var(--touch-orange);
    }

    /* Underline editorial bajo el score grande — toque sutil naranja */
    .display-italic[data-accent="touch"] {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>

  <script type="text/babel" src="screens-results.jsx"></script>

</body>
</html>
